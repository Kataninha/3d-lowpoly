<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#eee}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../../../../vendor/three.module.js","three/addons/geometries/RoundedBoxGeometry.js":"../../../../vendor/RoundedBoxGeometry.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {criarZeDesmonte,luzPadrao} from '../../ze-desmonte-v2.js';
import * as m from '../../moves.js';
const W=900,H=2400, rows=['M01_segurar','M02_girarBotao','M03_pegarCabo','M04_susto','M05_comemorar','M08_idle','M09_caminhadaCurta','alcancar'];
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setClearColor(0xeae4d8);renderer.setScissorTest(true);document.body.append(renderer.domElement);
const errors=[],results=[],overlaps=[]; const alvo=new THREE.Vector3(-.85,1.95,.45);
function largest(root,exclude=[]) {
  let best=null,volume=0;
  root.traverse(o=>{
    if(!o.isMesh||exclude.some(x=>x===o||x.getObjectById(o.id))) return;
    o.geometry.computeBoundingBox();const size=o.geometry.boundingBox.getSize(new THREE.Vector3());const v=size.x*size.y*size.z;
    if(v>volume){best=o;volume=v;}
  });return best;
}
function inspect(ze,name,time){
  const j=ze.juntas, head=largest(j.cabeca), body=largest(j.tronco,[j.cabeca,j.ombroE,j.ombroD]);
  if(!head||!body) throw new Error('geometria corporal ausente');
  const v=n=>n.getWorldPosition(new THREE.Vector3());
  for(const side of ['E','D']){
    const points=[v(j['ombro'+side]),v(j['cotovelo'+side]),v(j['pulso'+side]),v(ze.maos[side])];
    for(let n=0;n<3;n++){
      const a=points[n].clone(),b=points[n+1].clone();
      if(n===0) a.lerp(b,.28); // Shoulder sphere joins the torso by design.
      const d=b.clone().sub(a),length=d.length(); if(length<1e-7)continue;
      const ray=new THREE.Raycaster(a,d.normalize(),0,length);
      for(const [label,mesh] of [['tronco',body],['cabeca',head]])
        if(ray.intersectObject(mesh,false).length) overlaps.push({name,time,side,segment:n,part:label});
    }
  }
}
for(let row=0;row<rows.length;row++) for(let col=0;col<3;col++){
  const scene=new THREE.Scene();luzPadrao(scene);
  const ze=criarZeDesmonte();scene.add(ze.raiz);
  const floor=new THREE.GridHelper(5,10,0xb5ada0,0xd4cdbf);floor.position.y=-.005;scene.add(floor);
  const camera=new THREE.PerspectiveCamera(30,1,.1,100);camera.position.set(4,2.6,8.4);camera.lookAt(0,1.8,0);
  const target=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,.08),new THREE.MeshStandardMaterial({color:0x1568ba}));target.position.copy(alvo).add(new THREE.Vector3(0,0,.04));scene.add(target);
  const name=rows[row];let times=[0,.3,1];
  if(name==='M04_susto')times=[0,.15,.3];
  if(name==='M05_comemorar')times=[.25,.8,1.5];
  if(name==='M09_caminhadaCurta')times=[.15,.45,.75];
  const time=times[col];
  try{
    const opt={mao:'D',alvo,alvoLocal:alvo,t0:0,t1:1,de:new THREE.Vector3(0,0,0),para:new THREE.Vector3(.5,0,0)};
    if(name==='alcancar')m.alcancar(ze,'D',alvo,time,{t0:0,t1:.3});else m[name](ze,time,opt);
    scene.updateMatrixWorld(true);
    const grip=ze.maos.D.getWorldPosition(new THREE.Vector3());
    results.push({name,time,distancia:grip.distanceTo(alvo)});
    inspect(ze,name,time);
  }catch(e){errors.push({name,time,error:e.message})}
  renderer.setViewport(col*300,H-(row+1)*300,300,300);renderer.setScissor(col*300,H-(row+1)*300,300,300);renderer.render(scene,camera);
}
// Sample the planted ankle on a 0.5-unit walk; measure drift within each stance.
let maxDrift=0,previous=null;
const walker=criarZeDesmonte();
for(let i=0;i<=100;i++){
  const u=i/100, progress=u*u*(3-2*u),phase=(progress+.25)%1;
  m.M09_caminhadaCurta(walker,u,{t0:0,t1:1,de:new THREE.Vector3(),para:new THREE.Vector3(.5,0,0)});
  walker.raiz.updateWorldMatrix(true,true);
  const side=phase<.5?'E':'D', knee=walker.juntas['joelho'+side];
  const ankle=knee.children.find(x=>Math.abs(x.position.y+.6)<1e-6);
  if(!ankle){errors.push({name:'M09',error:'ankle missing'});break;}
  const pos=ankle.getWorldPosition(new THREE.Vector3());
  if(previous?.side===side)maxDrift=Math.max(maxDrift,pos.distanceTo(previous.pos));
  previous={side,pos};
}
// Compare a reused character after out-of-order seeks with a fresh instance.
const options={mao:'D',alvo,alvoLocal:alvo,t0:0,t1:1,de:new THREE.Vector3(),para:new THREE.Vector3(.5,0,0)};
const snapshot=z=>[...z.raiz.position.toArray(),...z.raiz.quaternion.toArray(),...Object.values(z.juntas).flatMap(j=>j.quaternion.toArray())];
for(const name of rows){
  const seek=criarZeDesmonte();
  const run=(z,t)=>name==='alcancar'?m.alcancar(z,'D',alvo,t,{t0:0,t1:.3}):m[name](z,t,options);
  try {
    for(const t of [1,0,.3])run(seek,t);
    const actual=snapshot(seek), fresh=criarZeDesmonte();run(fresh,.3);const expected=snapshot(fresh);
    const difference=Math.max(...actual.map((x,i)=>Math.abs(x-expected[i])));
    if(difference>1e-7) errors.push({name,error:'seek differs',difference});
  }catch(e){errors.push({name,error:'seek: '+e.message});}
}
document.body.dataset.test=JSON.stringify({errors,results,overlaps,maxDrift});
</script>
