<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#e9e2d5;font:20px sans-serif}canvas{display:block}#title{position:absolute;top:18px;left:25px;font-weight:bold;color:#27333b}#caption{position:absolute;bottom:18px;left:25px;color:#27333b}</style><script type="importmap">{"imports":{"three":"/biblioteca/vendor/three.module.js"}}</script></head><body><div id="title">MONTAGEM POR UNIDADES</div><div id="caption">Parede · verga · telha translúcida</div><script type="module">
import * as THREE from 'three';
import {montarPorUnidades,crescerPeca,camadaTranslucida} from '/biblioteca/efeitos/montagem-unidades.js';
const errors=[];function check(n,f){try{f()}catch(e){errors.push(n+': '+e.message)}}function assert(v,s){if(!v)throw Error(s)}
const g=new THREE.Group();for(let y=0;y<6;y++)for(let x=0;x<8;x++){const b=new THREE.Mesh(new THREE.BoxGeometry(.46,.22,.3),new THREE.MeshStandardMaterial({color:(x+y)%2?0xb65e40:0xc4734d,roughness:1}));b.position.set((x-3.5)*.48+(y%2)*.05,y*.24+.11,0);g.add(b)}
const beam=new THREE.Mesh(new THREE.BoxGeometry(1.9,.22,.38),new THREE.MeshStandardMaterial({color:0x8a9490}));beam.position.set(0,1.6,0);
const tile=new THREE.Mesh(new THREE.BoxGeometry(2.4,.12,.9),new THREE.MeshStandardMaterial({color:0xba5d3e}));tile.position.set(0,2.13,0);
const original=tile.material;
check('unidades e seek',()=>{const counts=[];for(const t of [-1,0,.5,1,2,3]){montarPorUnidades(g,t,{t0:0,dur:3});counts.push(g.children.filter(c=>c.visible).length)}assert(counts[0]===0&&counts[1]===1&&counts[5]===48,'contagens '+counts);assert(counts.every((v,i)=>!i||v>=counts[i-1]),'ordem');montarPorUnidades(g,1,{t0:0,dur:3});const a=g.children.map(c=>[c.visible,...c.scale.toArray()]);montarPorUnidades(g,3,{t0:0,dur:3});montarPorUnidades(g,1,{t0:0,dur:3});assert(JSON.stringify(a)===JSON.stringify(g.children.map(c=>[c.visible,...c.scale.toArray()])), 'seek reverso');montarPorUnidades(g,3,{t0:0,dur:3});assert(g.children.every(c=>c.visible&&c.scale.equals(new THREE.Vector3(1,1,1))),'resíduo')});
check('ordem perímetro',()=>{const p=new THREE.Group();[[1,1,0],[1,0,0],[-1,0,0]].forEach(v=>{let c=new THREE.Object3D();c.position.set(...v);p.add(c)});montarPorUnidades(p,.01,{t0:0,dur:1,ordem:'perimetro'});assert(p.children[1].visible&&!p.children[0].visible,'altura no mesmo ângulo')});
check('verga ancorada',()=>{const floor=beam.position.y-.11;crescerPeca(beam,.48,{t0:0,dur:1.2});assert(Math.abs(beam.position.y-.11*beam.scale.y-floor)<1e-8,'face deslocou');const a=beam.scale.y;crescerPeca(beam,1.2,{t0:0,dur:1.2});assert(beam.scale.y===1&&beam.position.y===1.6,'resíduo');crescerPeca(beam,.48,{t0:0,dur:1.2});assert(beam.scale.y===a,'seek')});
check('raio x',()=>{camadaTranslucida(tile,.8,{t0:0});assert(tile.material!==original&&Math.abs(tile.material.opacity-.25)<1e-8,'opacidade');camadaTranslucida(tile,2,{t0:0});assert(tile.material===original,'material não restaurado');camadaTranslucida(tile,.8,{t0:0});assert(Math.abs(tile.material.opacity-.25)<1e-8,'seek')});
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe9e2d5);scene.add(g,beam,tile);scene.add(new THREE.HemisphereLight(0xffffff,0x777066,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,7,5);scene.add(light);
const wood=new THREE.Mesh(new THREE.BoxGeometry(2.1,.18,.65),new THREE.MeshStandardMaterial({color:0x765033}));wood.position.set(0,1.97,0);scene.add(wood);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(960,720);document.body.appendChild(renderer.domElement);const camera=new THREE.OrthographicCamera(-3.1,3.1,2.325,-2.325,.1,100);camera.position.set(5,4,7);camera.lookAt(0,1,0);
const time=Number(new URLSearchParams(location.search).get('t')||0);montarPorUnidades(g,time,{t0:0,dur:3});crescerPeca(beam,Math.min(time,1.2),{t0:0});camadaTranslucida(tile,time,{t0:.5,dur:1.6});renderer.render(scene,camera);document.body.dataset.test=JSON.stringify(errors);document.querySelector('#caption').textContent=`Parede: ${time.toFixed(2)} s  ·  Verga: ${Math.round((.02+.98*Math.min(time/1.2,1))*100)}%  ·  Telha: ${tile.material===original?'opaca':'translúcida'}`;
</script></body></html>
