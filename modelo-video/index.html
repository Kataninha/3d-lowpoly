<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden} #root{position:relative;width:100%;height:100%;overflow:hidden;background:#dcebea;font-family:var(--apv-fonte)} #cena3d{position:absolute;inset:0;width:100%;height:100%}
.apv-legenda{top:69%;font-size:72px;color:var(--cor-texto)} .apv-legenda.chave{color:var(--cor-destaque)}
.etiqueta{position:absolute;top:16%;left:50%;translate:-50% 0;padding:14px 30px;background:var(--cor-destaque);color:var(--cor-contorno);border:5px solid var(--cor-contorno);border-radius:20px;font-size:44px;font-weight:900;white-space:nowrap}
.icone{position:absolute;top:24%;right:15%;font:900 130px/1 var(--apv-fonte);-webkit-text-stroke:7px var(--cor-contorno);paint-order:stroke fill}.positivo{color:var(--cor-positivo)}.negativo{color:var(--cor-negativo)}.controle{color:var(--cor-texto)}
.cta{position:absolute;top:10%;left:12%;width:76%;text-align:center;color:var(--cor-texto);font:800 50px/1.2 var(--apv-fonte);-webkit-text-stroke:5px var(--cor-contorno);paint-order:stroke fill}.cta{background:var(--cor-contorno);border-radius:20px;padding:12px}.cta b{color:var(--cor-destaque)} .cta .linha{font-size:38px;line-height:1.25;white-space:nowrap}.cta .linha + .linha{margin-top:10px}

<body>

<script>
const TEMPOS={"duracao": 8, "frases": [{"n": 0, "texto": "Veja a peça por dentro", "inicio": 0.5, "fim": 4.8}, {"n": 1, "texto": "Agora funciona", "inicio": 5.1, "fim": 7.0}], "palavras": [{"frase": 0, "palavra": "Veja", "inicio": 0.5, "fim": 1.1}, {"frase": 0, "palavra": "a", "inicio": 1.1, "fim": 1.5}, {"frase": 0, "palavra": "peça", "inicio": 1.5, "fim": 2.3, "destaque": true}, {"frase": 0, "palavra": "por", "inicio": 2.3, "fim": 2.8}, {"frase": 0, "palavra": "dentro", "inicio": 2.8, "fim": 4.8}, {"frase": 1, "palavra": "Agora", "inicio": 5.1, "fim": 5.8}, {"frase": 1, "palavra": "funciona", "inicio": 5.8, "fim": 7.0}]};
function W(frase,palavra){const matches=TEMPOS.palavras.filter(x=>x.frase===frase&&x.palavra.toLocaleLowerCase('pt-BR')===palavra.toLocaleLowerCase('pt-BR'));if(matches.length!==1)throw Error('Palavra ausente ou ambígua: '+palavra);return matches[0].inicio}
function E(frase){const f=TEMPOS.frases.find(x=>x.n===frase);if(!f)throw Error('Frase ausente: '+frase);return f.fim}
const tl=gsap.timeline({paused:true}); tl.to({}, {duration:8.000},0); window.__timelines=window.__timelines||{};window.__timelines.main=tl;
</script>
<script type="module">
import * as THREE from 'three';
import {criarZeDesmonte,luzPadrao,sombraDeContato} from './kit/personagens/ze-desmonte/ze-desmonte-padrao.js';
import {criarLavanderia} from './kit/cenarios/lavanderia/cenario.js';
import {criarEfeito} from './kit/efeitos/efeitos.js';
import {criarPeca} from './kit/efeitos/contorno-toon.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#cena3d'),antialias:true});renderer.setPixelRatio(1);renderer.setSize(1080,1920,false);
const cena=new THREE.Scene();cena.background=new THREE.Color(0xe6eeeb);luzPadrao(cena);
const lavanderia=criarLavanderia();cena.add(lavanderia.raiz);
const ze=criarZeDesmonte();ze.raiz.scale.setScalar(3.5/3.72);ze.raiz.position.set(-1.45,0,0.25);cena.add(ze.raiz);
const objeto=new THREE.Group();objeto.position.set(1.05,0,0.20);cena.add(objeto);
const estrutura=criarPeca(new THREE.BoxGeometry(1.45,1.8,1.2),new THREE.MeshStandardMaterial({color:0x8da6b1,roughness:.7,transparent:true,opacity:1}));estrutura.position.y=.9;objeto.add(estrutura);
const interior=criarPeca(new THREE.CylinderGeometry(.33,.33,1.35,16),new THREE.MeshStandardMaterial({color:0xf4a72b,roughness:.7}));interior.position.y=.9;interior.rotation.z=.5;objeto.add(interior);
estrutura.userData.casca.visible=false; interior.userData.casca.visible=false;
// The reference floor tiles rise to y=0.015; lift shadows slightly above them.
const sombraZe=sombraDeContato(0.9);sombraZe.position.set(-1.45,0.021,0.25);cena.add(sombraZe);
const sombraObjeto=sombraDeContato(0.82);sombraObjeto.position.set(1.05,0.021,0.20);cena.add(sombraObjeto);
const sombraInterior=sombraDeContato(0.36);sombraInterior.position.set(1.05,0.022,0.20);cena.add(sombraInterior);
const palavraTempo=(w)=>TEMPOS.palavras.filter(x=>x.frase===w.frase&&x.palavra.toLocaleLowerCase('pt-BR')===w.palavra.toLocaleLowerCase('pt-BR')).length===1?W(w.frase,w.palavra):w.inicio;
const primeira=TEMPOS.palavras[0]; const destaque=TEMPOS.palavras.find(w=>w.destaque)||TEMPOS.palavras[Math.min(2,TEMPOS.palavras.length-1)]; const interna=TEMPOS.palavras[Math.min(4,TEMPOS.palavras.length-1)]; const primeiraFrase=TEMPOS.frases[0];
const efeito=criarEfeito('suor',{alvo:ze.juntas.cabeca,inicio:palavraTempo(primeira),duracao:2.2,escala:.8});
const camera=new THREE.PerspectiveCamera(41,1080/1920,.1,100);const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
function desenhar(t){const aproximar=smooth((t-palavraTempo(destaque))/.45);const retornar=smooth((t-4.7)/.45);const zoom=aproximar*(1-retornar);camera.position.set(1.8+zoom*.06+t*.012,7.5,9.7-zoom*.65);camera.lookAt(-.26+zoom*.06,2.1,0);const opacidade=t>=palavraTempo(interna)&&t<E(primeiraFrase.n)?.22:1;estrutura.userData.malha.material.opacity=opacidade;estrutura.userData.malha.material.depthWrite=opacidade===1;estrutura.userData.casca.material.transparent=true;estrutura.userData.casca.material.opacity=opacidade;estrutura.userData.casca.material.depthWrite=opacidade===1;ze.misturarPoses('parado','explicar',smooth(t/.45)).emocao(t>=5?'feliz':'surpreso');ze.juntas.ombroD.rotation.z=0.05;ze.juntas.cotoveloD.rotation.set(0,0,0);ze.apontarPara(new THREE.Vector3(0.40,2.15,0.92),{lado:'E',intensidade:smooth((t-1.2)/.45)});ze.atualizar(t);efeito.atualizar(t);lavanderia.atualizar(t);renderer.render(cena,camera)}
window.addEventListener('hf-seek',e=>desenhar(e.detail.time));desenhar(0);
</script>
