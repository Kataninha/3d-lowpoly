<!doctype html><meta charset="utf-8">
<style>:root{--cor-destaque:#ffd400}html,body{margin:0;background:#2b3a4a}</style>
<script type="importmap">{"imports":{"three":"/biblioteca/vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {criarPeca} from '/biblioteca/efeitos/contorno-toon.js';
import {destacarPeca} from '/biblioteca/efeitos/destaque-peca.js';
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(480,270); document.body.append(r.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x2b3a4a);
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,1.2)); const sun=new THREE.DirectionalLight(0xffffff,1.5); sun.position.set(3,5,4); scene.add(sun);
const shared=new THREE.MeshStandardMaterial({color:0x3a8fd0,flatShading:true});
const a=criarPeca(new THREE.BoxGeometry(1,1,1),shared), b=criarPeca(new THREE.BoxGeometry(1,1,1),shared); // b shares material with a: must not glow
const c=criarPeca(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial({color:0xcc4422})); // MeshBasic path
a.position.x=-1.6; c.position.x=1.6; scene.add(a,b,c);
const cam=new THREE.PerspectiveCamera(40,480/270,.1,50); cam.position.set(2.5,2,5.5); cam.lookAt(0,0,0);
window.render=t=>{destacarPeca(a,t,{t0:1,dur:1.2}); destacarPeca(c,t,{t0:1,dur:1.2}); r.render(scene,cam)};
for(const t of (new URLSearchParams(location.search).get('seq')||'0').split(',')) render(+t); // last value is the frame shown
window.__pronto=true;
</script>
