// Ze v3 mede ~4,84 u de topete a bota; escala para 1,75 m = 3,5 u

  const sol = new THREE.DirectionalLight(0xffffff, 2.2); sol.position.set(12, 22, 26); sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048);
  Object.assign(sol.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, far: 80 }); sol.shadow.bias = -0.0005; scene.add(sol);
  const fill = new THREE.DirectionalLight(0xcfe9ff, 0.7); fill.position.set(-10, 6, 18); scene.add(fill);

  const ze = sentarZe(sala);
  sala.updateAt(t, cfg.p);
  if (cfg.corte) { sala.group.getObjectByName('paisagem').visible = false; const caps = new THREE.Group(); scene.add(caps); criarCorte(caps).aplicar(sala.group, new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0)); }
  const zeEmPe = criarZe({ figurino: 'casa' }); zeEmPe.raiz.scale.setScalar(escalaZe());
  const bz = B(ze.raiz), sf = solida(sala.sofa);
  Object.assign(teste, {
    zeEmPeAltura: r(B(zeEmPe.raiz).max.y - B(zeEmPe.raiz).min.y), zeSentadoAltura: r(bz.max.y - bz.min.y), zeSentadoSoloY: r(bz.min.y),
    sofaMinY: r(sf.min.y), sofaTopoEncostoY: r(sf.max.y), sofaAssentoY: sala.assentoY, sofaComprimento: r(sf.getSize(new THREE.Vector3()).z),
    roboMinY: r(solida(sala.robo).min.y), roboDiametro: r(solida(sala.robo).getSize(new THREE.Vector3()).x),
    luminariaMinY: r(solida(sala.luminaria).min.y), cabideMinY: r(solida(sala.cabide).min.y), plantaMinY: r(solida(sala.planta).min.y),
