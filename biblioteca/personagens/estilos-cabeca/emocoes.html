<script type="module">
import * as THREE from 'three'; import { luzPadrao, EMOCOES } from '../ze/ze-v4.js'; import { criarPersonagem } from './estilos.js';
const q=new URLSearchParams(location.search), grupo=q.get('grupo')||'novas', W=1500,H=1200,cw=W/5,ch=H/4;
const nomes=grupo==='novas'?Object.keys(EMOCOES).slice(11):Object.keys(EMOCOES).slice(0,11);
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.setClearColor(0xeae4d8);r.setScissorTest(true);document.body.prepend(r.domElement);

const p=criarPersonagem(q.get('estilo')||'principal');scene.add(p.raiz);const fails=[];
nomes.forEach((n,i)=>{try{p.emocao(n);p.atualizar(1.3,{piscar:false});const x=(i%5)*cw,y=H-(Math.floor(i/5)+1)*ch;r.setViewport(x,y,cw,ch);r.setScissor(x,y,cw,ch);r.render(scene,camera);}catch(e){fails.push(n+': '+e.message)}
